<div class="login-page">
  <div class="login-card card">
    <div class="login-header">
      <img class="login-logo" src="/icoBluOra.png" alt="Circuito Admin" />
      <h1 class="login-title">Painel do Admin</h1>
    </div>

    <div class="login-body">
      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <div class="field">
        <label class="field-label" for="username">Usuário</label>
        <input
          id="username"
          type="text"
          class="field-input"
          placeholder="Digite seu usuário"
          [(ngModel)]="username"
          (keyup.enter)="submit()"
          autocomplete="username"
        />
      </div>

      <div class="field">
        <label class="field-label" for="password">Senha</label>
        <div class="field-password">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            class="field-input"
            placeholder="Digite sua senha"
            [(ngModel)]="password"
            (keyup.enter)="submit()"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="showPassword = !showPassword"
            [title]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
          >
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
              <line x1="2" x2="22" y1="2" y2="22"/>
            </svg>
          </button>
        </div>
      </div>

      <button
        class="btn btn-primary login-btn"
        (click)="submit()"
        [disabled]="loading"
      >
        <span *ngIf="!loading">Entrar</span>
        <span *ngIf="loading" class="login-spinner"></span>
      </button>
    </div>
  </div>
</div>

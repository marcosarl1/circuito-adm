@if (!isOpen()) {
  <header
    class="md:hidden fixed left-0 right-0 top-0 z-[60] flex h-14 items-center gap-3 border-b border-[var(--sidebar-border-subtle)] bg-[var(--sidebar-bg)] px-4"
  >
    <button
      type="button"
      class="grid h-9 w-9 shrink-0 place-items-center rounded-md border border-[var(--sidebar-border-subtle)] text-[var(--foreground)] hover:bg-[var(--sidebar-accent)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-teal-500)]"
      (click)="toggle()"
      [attr.aria-expanded]="isOpen()"
      aria-label="Abrir menu"
    >
      <app-icon name="heroBars3" size="20" strokeWidth="1.8"></app-icon>
    </button>
    <img class="h-8 w-8 object-contain" src="/icoBluOra.png" alt="" />
    <h2 class="m-0 text-base font-bold tracking-[0.06em] text-[var(--foreground)]">CIRCUITO</h2>
  </header>
}

@if (isOpen()) {
  <div class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm md:hidden" (click)="close()" aria-hidden="true"></div>
}

<aside
  class="fixed left-0 top-0 z-50 flex h-dvh w-[280px] flex-col overflow-hidden border-r border-[var(--sidebar-border-subtle)] bg-[var(--sidebar-bg)] py-3 text-[var(--foreground)] transition-all duration-200 ease-out md:translate-x-0"
  [ngClass]="isRailExpanded() ? 'md:w-[var(--sidebar-rail-expanded)]' : 'md:w-[var(--sidebar-rail)]'"
  [class.-translate-x-full]="!isOpen()"
  [class.translate-x-0]="isOpen()"
  (mouseenter)="setHovered(true)"
  (mouseleave)="setHovered(false)"
  (focusin)="setHovered(true)"
  (focusout)="setHovered(false)"
  aria-label="Navegação principal"
>
  <!-- Tailwind scan keep: md:w-[64px] md:w-[220px] -->
  <!-- Top: logo + collapse toggle (desktop) -->
  <div class="flex h-14 shrink-0 items-center gap-3 border-b border-[var(--sidebar-border-subtle)] px-3 pb-3">
    <img class="h-9 w-9 shrink-0 object-contain" src="/icoBluOra.png" alt="" />
    <div
      class="min-w-0 flex-1 overflow-hidden transition-all duration-200 ease-out"
      [class.max-w-0]="!isRailExpanded()"
      [class.opacity-0]="!isRailExpanded()"
      [class.max-w-[140px]]="isRailExpanded()"
      [class.opacity-100]="isRailExpanded()"
      [attr.aria-hidden]="!isRailExpanded() ? 'true' : null"
    >
      <h2 class="m-0 truncate text-sm font-bold tracking-[0.06em] text-[var(--foreground)]">CIRCUITO</h2>
      <p class="truncate text-xs text-[var(--muted-foreground)]">Admin</p>
    </div>
    <button
      type="button"
      class="hidden h-7 w-7 shrink-0 place-items-center rounded-md text-[var(--muted-foreground)] hover:bg-[var(--sidebar-accent)] hover:text-[var(--foreground)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-teal-500)] md:grid"
      (click)="toggleRail()"
      [attr.aria-label]="isCollapsed() ? 'Expandir menu' : 'Recolher menu'"
      [title]="isCollapsed() ? 'Expandir' : 'Recolher'"
      [class.opacity-0]="!isRailExpanded()"
      [class.pointer-events-none]="!isRailExpanded()"
      [class.opacity-100]="isRailExpanded()"
      [attr.tabindex]="!isRailExpanded() ? -1 : 0"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        @if (isCollapsed()) {
          <path d="m9 18 6-6-6-6" />
        } @else {
          <path d="m15 18-6-6 6-6" />
        }
      </svg>
    </button>
    <!-- mobile close -->
    <button
      type="button"
      class="grid h-9 w-9 shrink-0 place-items-center rounded-md text-[var(--muted-foreground)] hover:bg-[var(--sidebar-accent)] hover:text-[var(--foreground)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-teal-500)] md:hidden"
      (click)="close()"
      aria-label="Fechar menu"
    >
      <app-icon name="heroXMark" size="20" strokeWidth="1.8"></app-icon>
    </button>
  </div>

  <!-- Nav -->
  <nav class="flex-1 overflow-y-auto overflow-x-hidden px-2 py-4">
    @if (isDrawerExpanded()) {
      <p class="mb-2 px-3 text-[0.68rem] font-bold uppercase tracking-[0.08em] text-[var(--muted-foreground)]">Conteúdo</p>
    } @else {
      <div class="mx-2 mb-3 h-px bg-[var(--sidebar-border-subtle)]"></div>
    }
    <ul class="m-0 list-none p-0">
      @for (item of menuItems; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="!bg-[var(--primary)] !text-white [&_span:first-child]:!bg-white/15 [&_span:first-child]:!text-white"
            [routerLinkActiveOptions]="{ exact: false }"
            (click)="close()"
            class="group mb-1.5 flex min-h-[44px] items-center rounded-lg py-2.5 text-[var(--foreground)] no-underline transition-all duration-200 ease-out hover:bg-[var(--sidebar-accent)] hover:text-[var(--foreground)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-teal-500)]"
            [class.gap-3]="isDrawerExpanded()"
            [class.gap-0]="!isDrawerExpanded()"
            [ngClass]="isDrawerExpanded() ? 'px-2.5' : 'px-2'"
            [class.justify-center]="!isDrawerExpanded()"
            [attr.title]="!isDrawerExpanded() ? item.label : null"
            [attr.aria-label]="item.label"
            [attr.aria-current]="null"
          >
            <span
              class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-[rgba(2,48,71,0.88)] text-[var(--primary)] leading-none transition-colors"
              aria-hidden="true"
            >
              <app-icon [name]="item.icon" size="18" strokeWidth="1.8" klass="flex items-center justify-center leading-none"></app-icon>
            </span>
            <span
              class="flex-1 truncate text-sm font-medium transition-all duration-200 ease-out"
              [class.max-w-0]="!isDrawerExpanded()"
              [class.opacity-0]="!isDrawerExpanded()"
              [class.overflow-hidden]="!isDrawerExpanded()"
              [class.whitespace-nowrap]="!isDrawerExpanded()"
              [class.max-w-[140px]]="isDrawerExpanded()"
              [class.opacity-100]="isDrawerExpanded()"
              [attr.aria-hidden]="!isDrawerExpanded() ? 'true' : null"
              >{{ item.label }}</span
            >
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Footer: Sair -->
  <div class="shrink-0 border-t border-[var(--sidebar-border-subtle)] p-2.5">
    @if (isDrawerExpanded()) {
      <button
        class="inline-flex w-full items-center justify-start gap-2.5 rounded-md border border-[var(--sidebar-border-subtle)] bg-[rgba(2,48,71,0.35)] px-3 py-2.5 text-sm font-medium text-[var(--color-text-secondary)] transition-colors hover:border-[rgba(248,113,113,0.28)] hover:bg-[rgba(153,27,27,0.2)] hover:text-[#fecaca] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-teal-500)]"
        (click)="logout()"
      >
        <app-icon name="heroArrowRightStartOnRectangle" size="18" strokeWidth="1.8"></app-icon>
        Sair
      </button>
    } @else {
      <button
        class="grid h-10 w-full place-items-center rounded-md border border-transparent text-[var(--muted-foreground)] hover:bg-[rgba(153,27,27,0.2)] hover:text-[#fecaca] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-teal-500)]"
        (click)="logout()"
        title="Sair"
        aria-label="Sair"
      >
        <app-icon name="heroArrowRightStartOnRectangle" size="20" strokeWidth="1.8"></app-icon>
      </button>
    }
  </div>
</aside>

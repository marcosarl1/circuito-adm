<div
  class="fixed inset-0 z-[300] grid place-items-center bg-black/60 backdrop-blur-sm"
>
  <div
    class="w-[min(420px,90vw) rounded-xl border border-[rgba(142,202,230,0.22)] bg-[rgba(1,19,28,0.97)] p-6 shadow-[var(--shadow-lg)]]"
  >
    <h3 class="m-0 mb-2 text-lg font-bold">Sessão prestes a expirar</h3>
    <p class="m-0 mb-4 text-sm text-[var(--color-text-secondary)]">
      Você será desconectado por inatividade em
      <span class="font-bold text-[var(--primary)]">{{ formattedTime() }}</span>
    </p>
    <div class="flex justify-end">
      <button class="btn btn-primary" (click)="continueSession.emit()">
        Continuar conectado
      </button>
    </div>
  </div>
</div>

@if (visible()) {
  <div
    class="fixed inset-0 z-[1000] flex items-end justify-center bg-black/60 sm:p-4 backdrop-blur-sm sm:items-center"
    (click)="cancel()"
  >
    <div
      class="card w-full rounded-b-none rounded-t-[var(--radius-xl)] sm:max-w-[400px] sm:rounded-[var(--radius-xl)]"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-desc"
      (click)="$event.stopPropagation()"
      (keyup.escape)="cancel()"
    >
      <div class="flex items-start gap-[var(--space-md)] p-[var(--space-xl)]">
        <div
          class="grid h-10 w-10 shrink-0 place-items-center rounded-full"
          [class.bg-[rgba(153,27,27,0.2)]]="variant() === 'danger'"
          [class.bg-[rgba(251,133,0,0.15)]]="variant() !== 'danger'"
          aria-hidden="true"
        >
          @if (variant() === 'danger') {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#fecaca"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
              <path d="M10 11v6" />
              <path d="M14 11v6" />
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
            </svg>
          } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#ffb703"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
          }
        </div>
        <div>
          <h3
            id="confirm-title"
            class="m-0 mb-[var(--space-xs)] text-[length:var(--font-size-md)] font-bold"
          >
            {{ title() }}
          </h3>
          <p
            id="confirm-desc"
            class="m-0 text-[length:var(--font-size-sm)] text-[var(--color-text-secondary)]"
          >
            {{ message() }}
          </p>
        </div>
      </div>
      <div
        class="flex flex-col gap-[var(--space-sm)] border-t border-[rgba(142,202,230,0.12)] p-[var(--space-lg)] sm:flex-row sm:justify-end"
      >
        <button
          class="btn btn-secondary min-h-12 sm:min-h-9"
          (click)="cancel()"
          autofocus
        >
          {{ cancelText() }}
        </button>
        @if (variant() === 'danger') {
          <button class="btn btn-danger min-h-12 sm:min-h-9" (click)="confirm()">
            {{ confirmText() }}
          </button>
        } @else {
          <button class="btn btn-primary min-h-12 sm:min-h-9" (click)="confirm()">
            {{ confirmText() }}
          </button>
        }
      </div>
    </div>
  </div>
}

<div
  class="fixed bottom-4 left-4 right-4 z-[2000] flex flex-col gap-2 sm:left-auto sm:right-4 sm:w-80"
  aria-live="polite"
  aria-label="Notificações"
>
  @for (item of toast.toasts(); track item.id) {
    <div
      class="relative flex items-start gap-3 overflow-hidden rounded-[var(--radius-md)] border-l-4 bg-[#011520] p-4 pr-3 shadow-[0_0_0_1px_rgba(142,202,230,0.15),0_8px_32px_rgba(0,0,0,0.7)]"
      [class.border-green-500]="item.type === 'success'"
      [class.border-red-500]="item.type === 'error'"
      [class.border-sky-400]="item.type === 'info'"
      role="alert"
    >
      <div class="mt-0.5 shrink-0" aria-hidden="true">
        @if (item.type === "success") {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#22c55e"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12" />
          </svg>
        } @else if (item.type === "info") {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#38bdf8"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
            <line x1="12" y1="8" x2="12" y2="12" />
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#f87171"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
        }
      </div>
      <div class="flex flex-1 flex-col gap-2">
        <p class="m-0 text-[length:var(--font-size-sm)]">
          {{ item.message }}
        </p>
        @if (item.actionLabel) {
          <div class="flex justify-end">
            <button
              class="rounded border border-[rgba(142,202,230,0.22)] px-3 py-1 text-xs font-medium text-[var(--color-text-secondary)] hover:bg-[rgba(142,202,230,0.12)] hover:border-[rgba(142,202,230,0.35)]"
              (click)="item.onAction?.(); toast.dismiss(item.id)"
              type="button"
            >
              {{ item.actionLabel }}
            </button>
          </div>
        }
      </div>
      <button
        class="shrink-0 text-[var(--color-text-secondary)] transition-colors hover:text-[var(--color-text-primary)]"
        (click)="toast.dismiss(item.id)"
        aria-label="Fechar notificação"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      @if (item.durationMs) {
        <div
          class="pointer-events-none absolute bottom-0 left-0 h-0.5 w-full bg-[var(--brand-teal-500)]"
          [style.animation]="'shrink ' + item.durationMs + 'ms linear forwards'"
        ></div>
      }
    </div>
  }
</div>

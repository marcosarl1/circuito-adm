<div
  class="fixed bottom-4 left-4 right-4 z-[2000] flex flex-col gap-2 sm:left-auto sm:right-4 sm:w-80"
  aria-live="polite"
  aria-label="Notificações"
>
  @for (item of toast.toasts(); track item.id) {
    <div
      class="card flex items-start gap-3 border-l-4 p-4 pr-3 shadow-[var(--shadow-lg)]"
      [class.border-green-500]="item.type === 'success'"
      [class.border-red-500]="item.type === 'error'"
      role="alert"
    >
      <div class="mt-0.5 shrink-0" aria-hidden="true">
        @if (item.type === "success") {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#22c55e"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12" />
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#f87171"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
        }
      </div>
      <p class="m-0 flex-1 text-[length:var(--font-size-sm)]">
        {{ item.message }}
      </p>
      <button
        class="shrink-0 text-[var(--color-text-secondary)] transition-colors hover:text-[var(--color-text-primary)]"
        (click)="toast.dismiss(item.id)"
        aria-label="Fechar notificação"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
  }
</div>

@if (visible()) {
  <div
    class="fixed inset-0 z-[1000] grid place-items-center bg-black/60 p-4 backdrop-blur-sm"
    (click)="cancel()"
  >
    <div
      class="w-full max-w-[420px] rounded-[var(--radius-xl)] border border-[rgba(142,202,230,0.22)] bg-[rgba(1,19,28,0.97)] p-4 shadow-[var(--shadow-lg)] sm:p-[var(--space-xl)]"
      role="dialog"
      aria-modal="true"
      aria-labelledby="api-key-modal-title"
      aria-describedby="api-key-modal-desc"
      (click)="$event.stopPropagation()"
    >
      <h3
        id="api-key-modal-title"
        class="m-0 mb-[var(--space-xs)] text-base font-bold sm:text-[length:var(--font-size-lg)]"
      >
        Autenticação necessária
      </h3>
      <p
        id="api-key-modal-desc"
        class="m-0 mb-[var(--space-lg)] text-sm text-[var(--color-text-secondary)] sm:text-[length:var(--font-size-sm)]"
      >
        {{ currentRequest?.label }}
      </p>

      <div class="relative mb-[var(--space-lg)] flex">
        <input
          #keyInput
          [type]="showKey() ? 'text' : 'password'"
          class="min-h-[46px] w-full rounded-[var(--radius-md)] border border-[rgba(142,202,230,0.22)] bg-[rgba(2,48,71,0.4)] px-[var(--space-md)] pr-12 font-[inherit] text-inherit focus:outline-none focus:border-[var(--brand-teal-500)] focus:shadow-[0_0_0_3px_rgba(33,158,188,0.16)] sm:min-h-[44px]"
          placeholder="Digite a API Key"
          [ngModel]="keyValue()"
          (ngModelChange)="keyValue.set($event)"
          (keyup.enter)="confirm()"
          (keyup.escape)="cancel()"
          autocomplete="off"
          autofocus
          [attr.aria-label]="
            currentRequest?.label
              ? 'API Key para ' + currentRequest.label
              : 'API Key'
          "
        />
        <button
          type="button"
          class="absolute right-0 top-0 grid h-[46px] w-[46px] place-items-center border-none bg-transparent text-[var(--color-text-secondary)] transition-colors duration-150 hover:text-[var(--foreground)] focus-visible:outline-2 focus-visible:outline-offset-[-2px] focus-visible:outline-[var(--brand-teal-500)] rounded-r-md sm:h-[44px] sm:w-[44px]"
          (click)="showKey.set(!showKey())"
          [title]="showKey() ? 'Ocultar' : 'Mostrar'"
          [attr.aria-label]="showKey() ? 'Ocultar API Key' : 'Mostrar API Key'"
          [attr.aria-pressed]="showKey()"
        >
          @if (!showKey()) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
              <path
                d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
              />
              <path
                d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"
              />
              <line x1="2" x2="22" y1="2" y2="22" />
            </svg>
          }
        </button>
      </div>

      <div
        class="flex flex-col-reverse gap-[var(--space-sm)] sm:flex-row sm:justify-end"
      >
        <button
          class="btn btn-secondary min-h-11 sm:min-h-9"
          (click)="cancel()"
        >
          Cancelar
        </button>
        <button
          class="btn btn-primary min-h-11 sm:min-h-9"
          (click)="confirm()"
          [disabled]="!keyValue().trim()"
        >
          Confirmar
        </button>
      </div>
    </div>
  </div>
}

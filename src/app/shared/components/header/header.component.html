<header
  class="sticky top-0 z-20 flex h-14 shrink-0 items-center justify-between gap-4 border-b border-[var(--sidebar-border-subtle)] bg-[var(--card)] px-4 backdrop-blur supports-[backdrop-filter]:bg-[var(--card)] md:px-6"
  role="banner"
>
  <nav aria-label="Breadcrumb" class="flex min-w-0 items-center gap-2">
    <span
      class="truncate text-sm font-semibold tracking-tight text-[var(--foreground)]"
      >{{ breadcrumb() }}</span
    >
  </nav>
  <div class="flex shrink-0 items-center gap-2">
    <ng-content></ng-content>
  </div>
</header>

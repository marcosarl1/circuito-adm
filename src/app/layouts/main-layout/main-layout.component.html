<div class="flex min-h-screen flex-col md:flex-row">
  <app-sidebar></app-sidebar>
  <div
    class="flex min-w-0 flex-1 flex-col bg-[var(--background)] transition-all duration-200 ease-out"
    [ngClass]="sidebarState.isRailExpanded() ? 'md:ml-[var(--sidebar-rail-expanded)]' : 'md:ml-[var(--sidebar-rail)]'"
  >
    <!-- Tailwind scan keep: md:ml-[64px] md:ml-[220px] -->
    <main class="flex-1 overflow-y-auto pb-8 pt-20 md:pt-6">
      <div class="container">
        <router-outlet></router-outlet>
      </div>
      <app-toast></app-toast>
    </main>
  </div>
</div>

@if (showWarning()) {
  <app-inactivity-warning-modal
    [secondsRemaining]="secondsRemaining()"
    (continueSession)="continueSession()"
  ></app-inactivity-warning-modal>
}

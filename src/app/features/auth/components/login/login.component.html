<div class="grid min-h-screen place-items-center bg-[var(--background)] p-4">
  <div class="card w-full max-w-[420px] overflow-hidden">
    <div
      class="grid justify-items-center border-b border-[rgba(142,202,230,0.14)] bg-[rgba(2,48,71,0.18)] px-6 pb-4 pt-6 text-center"
    >
      <img
        class="mb-3 h-36 w-36 object-contain"
        src="/icoBluOra.png"
        alt="Circuito Admin"
      />
      <h1 class="m-0 text-2xl font-bold tracking-[-0.01em]">Painel do Admin</h1>
    </div>

    <div class="grid gap-4 p-6">
      @if (errorMessage) {
        <div class="alert alert-error">
          {{ errorMessage }}
        </div>
      }
      <div class="grid gap-1">
        <label
          class="text-sm font-semibold text-[var(--color-text-secondary)]"
          for="username"
          >Usuário</label
        >
        <input
          id="username"
          type="text"
          class="min-h-11 w-full rounded-md border border-[rgba(142,202,230,0.22)] px-3 text-base"
          placeholder="Digite seu usuário"
          [(ngModel)]="username"
          (keyup.enter)="submit()"
          autocomplete="username"
        />
      </div>

      <div class="grid gap-1">
        <label
          class="text-sm font-semibold text-[var(--color-text-secondary)]"
          for="password"
          >Senha</label
        >
        <div class="relative flex">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            class="min-h-11 w-full rounded-md border border-[rgba(142,202,230,0.22)] px-3 pr-12 text-base"
            placeholder="Digite sua senha"
            [(ngModel)]="password"
            (keyup.enter)="submit()"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="absolute right-0 top-0 grid h-11 w-11 place-items-center border-none bg-transparent text-[var(--color-text-secondary)] transition-colors duration-150 hover:text-[var(--foreground)]"
            (click)="showPassword = !showPassword"
            [title]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
          >
            @if (!showPassword) {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            } @else {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                <path
                  d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
                />
                <path
                  d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"
                />
                <line x1="2" x2="22" y1="2" y2="22" />
              </svg>
            }
          </button>
        </div>
      </div>

      <button
        class="btn btn-primary mt-1 w-full min-h-[46px] text-base"
        (click)="submit()"
        [disabled]="loading"
      >
        @if (!loading) {
          <span>Entrar</span>
        } @else {
          <span
            class="inline-block h-[18px] w-[18px] animate-spin rounded-full border-2 border-[rgba(255,255,255,0.3)] border-t-white"
          ></span>
        }
      </button>
    </div>
  </div>
</div>

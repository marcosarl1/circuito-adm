<div
  class="grid min-h-[100dvh] place-items-center bg-[var(--background)] p-3 sm:p-4 md:p-6"
>
  <main
    class="card w-full max-w-[420px] overflow-hidden rounded-lg sm:rounded-xl shadow-lg"
  >
    <div
      class="grid justify-items-center border-b border-[rgba(142,202,230,0.14)] bg-[rgba(2,48,71,0.18)] px-4 py-4 sm:px-6 sm:pb-4 sm:pt-6 text-center"
    >
      <img
        class="mb-2 h-16 w-16 sm:h-24 sm:w-24 md:h-32 md:w-32 object-contain"
        src="/icoBluOra.png"
        alt="Circuito Admin"
        width="144"
        height="144"
        loading="eager"
      />
      <h1
        class="m-0 text-lg sm:text-xl md:text-2xl font-bold tracking-[-0.01em]"
      >
        Painel do Admin
      </h1>
    </div>

    <form
      class="grid gap-3 p-4 sm:gap-4 sm:p-6"
      (ngSubmit)="submit()"
      novalidate
      aria-label="Formulário de login"
    >
      @if (errorMessage()) {
        <div
          class="flex items-start gap-2 rounded-lg bg-red-500/10 border border-red-500/20 p-3 text-sm text-red-600"
          role="alert"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            class="mt-0.5 flex-shrink-0"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <div class="grid gap-1">
        <label
          class="text-xs sm:text-sm font-semibold text-[var(--color-text-secondary)]"
          for="username"
          >Usuário</label
        >
        <input
          id="username"
          name="username"
          type="text"
          class="min-h-[44px] sm:min-h-[46px] w-full rounded-md border border-[rgba(142,202,230,0.22)] px-3 text-sm sm:text-base focus:outline-none focus:border-[var(--primary-color)] focus:ring-2 focus:ring-[var(--primary-color)]/20"
          placeholder="Digite seu usuário"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          (keyup.enter)="submit()"
          autocomplete="username"
          autofocus
          inputmode="text"
          [attr.aria-invalid]="usernameError() ? 'true' : null"
          aria-describedby="username-error"
        />
        <div
          id="username-error"
          class="min-h-[1.25rem] text-xs text-red-600"
          role="status"
          aria-live="polite"
        >
          {{ usernameError() }}
        </div>
      </div>

      <div class="grid gap-1">
        <label
          class="text-xs sm:text-sm font-semibold text-[var(--color-text-secondary)]"
          for="password"
          >Senha</label
        >
        <div class="relative flex">
          <input
            id="password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="min-h-[44px] sm:min-h-[46px] w-full rounded-md border border-[rgba(142,202,230,0.22)] px-3 pr-12 text-sm sm:text-base focus:outline-none focus:border-[var(--primary-color)] focus:ring-2 focus:ring-[var(--primary-color)]/20"
            placeholder="Digite sua senha"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            (keyup.enter)="submit()"
            autocomplete="current-password"
            [attr.aria-invalid]="passwordError() ? 'true' : null"
            aria-describedby="password-error"
          />
          <button
            type="button"
            class="absolute right-0 top-0 grid h-[44px] w-[44px] sm:h-[46px] sm:w-[46px] place-items-center border-none bg-transparent text-[var(--color-text-secondary)] transition-colors duration-150 hover:text-[var(--foreground)] focus-visible:outline-2 focus-visible:outline-offset-[-2px] focus-visible:outline-[var(--primary-color)] rounded-r-md"
            (click)="togglePasswordVisibility()"
            [title]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
            [attr.aria-label]="
              showPassword() ? 'Ocultar senha' : 'Mostrar senha'
            "
            [attr.aria-pressed]="showPassword()"
          >
            @if (!showPassword()) {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            } @else {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                <path
                  d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
                />
                <path
                  d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"
                />
                <line x1="2" x2="22" y1="2" y2="22" />
              </svg>
            }
          </button>
        </div>
        <div
          id="password-error"
          class="min-h-[1.25rem] text-xs text-red-600"
          role="status"
          aria-live="polite"
        >
          {{ passwordError() }}
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary mt-2 flex w-full min-h-[48px] items-center justify-center gap-2 text-sm font-semibold transition-all duration-200 hover:brightness-110 active:scale-[0.98] disabled:opacity-70 disabled:cursor-not-allowed disabled:active:scale-100 sm:min-h-[46px] sm:text-base"
        [disabled]="loading()"
        [attr.aria-busy]="loading()"
      >
        @if (loading()) {
          <span
            class="inline-block h-[18px] w-[18px] shrink-0 animate-spin rounded-full border-2 border-[rgba(255,255,255,0.3)] border-t-white sm:h-[20px] sm:w-[20px]"
            aria-hidden="true"
          ></span>
        }
        <span>{{ loading() ? "Entrando..." : "Entrar" }}</span>
      </button>
    </form>
  </main>
</div>

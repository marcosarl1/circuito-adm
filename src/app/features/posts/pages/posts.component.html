<section
  class="mb-6 rounded-xl border border-[rgba(142,202,230,0.18)] bg-[rgba(1,19,28,0.92)] p-6 shadow-[var(--shadow-sm)]"
>
  <div>
    <h2 class="m-0 text-2xl font-normal">
      <span class="font-bold text-[var(--primary)]">Postagens</span>
    </h2>
  </div>
</section>
<app-post-form-card
  [(formData)]="formData"
  [imagePreview]="imagePreview()"
  [selectedImageName]="selectedImageName()"
  (publish)="publishPost()"
  (reset)="resetForm()"
  (imageSelected)="onImageSelected($event)"
  (titleChange)="onTitleChange($event)"
></app-post-form-card>

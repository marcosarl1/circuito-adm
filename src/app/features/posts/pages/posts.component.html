<div class="mx-auto grid w-full max-w-[1240px] gap-6">
  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

  <section class="card flex items-end justify-between gap-4 p-6 max-md:flex-col max-md:items-stretch">
    <div>
      <h2 class="m-0 text-2xl font-normal"><span class="font-bold text-[var(--primary)]">Postagens</span></h2>
    </div>
  </section>

  <app-post-form-card
    [formData]="formData"
    [loading]="loading"
    [imagePreview]="imagePreview"
    [selectedImageName]="selectedImageName"
    (publish)="publishPost()"
    (reset)="resetForm()"
    (imageSelected)="onImageSelected($event)"
    (titleChange)="onTitleChange($event)"
  ></app-post-form-card>
</div>

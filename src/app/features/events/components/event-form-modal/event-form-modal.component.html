<div
  class="fixed inset-0 z-[200] grid place-items-center bg-[rgba(0,0,0,0.72)] p-4 max-md:p-0"
  (click)="cancel.emit()"
>
  <div
    class="card flex max-h-[min(90vh,920px)] w-full max-w-[1040px] flex-col overflow-hidden max-md:max-h-screen max-md:rounded-none"
    role="dialog"
    aria-modal="true"
    aria-labelledby="event-form-title"
    (click)="$event.stopPropagation()"
  >
    <div class="card-header border-b border-[var(--color-border-light)]">
      <h3 id="event-form-title" class="m-0">
        {{ editingId() ? "Editar corrida" : "Adicionar corrida" }}
      </h3>
      <p class="mb-0 mt-1 text-sm text-[var(--color-text-secondary)]">
        Campos em lista aceitam uma entrada por linha.
      </p>
    </div>

    <div class="modal-body md:p-6" cdkScrollable>
      <app-event-main-form [(formData)]="formData" [submitted]="submitted()" />

      <div class="border-t border-[var(--color-border-light)]"></div>

      <app-event-media-pricing [(formData)]="formData" [submitted]="submitted()" />

      <div class="border-t border-[var(--color-border-light)]"></div>

      <app-event-route-kits
        [(formData)]="formData"
        [submitted]="submitted()"
        (addKit)="addKit.emit()"
        (removeKit)="removeKit.emit($event)"
      />
    </div>

    <div
      class="card-footer flex flex-col-reverse gap-2 border-t border-[var(--color-border-light)] sm:flex-row sm:justify-end"
    >
      <button
        class="btn btn-secondary min-h-11 sm:min-h-9"
        type="button"
        (click)="handleCancel()"
      >
        Cancelar
      </button>
      <button
        class="btn btn-primary min-h-11 sm:min-h-9"
        (click)="handleSave()"
        [attr.aria-busy]="loading()"
      >
        {{ editingId() ? "Atualizar" : "Criar" }}
      </button>
    </div>
  </div>
</div>

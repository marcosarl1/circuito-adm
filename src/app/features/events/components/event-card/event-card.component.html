<article
  class="card flex h-full flex-col overflow-hidden transition-all hover:border-[var(--primary)] hover:shadow-[var(--shadow-md)]"
>
  @if (event().url_imagem) {
    <div class="relative aspect-[16/9] w-full overflow-hidden bg-[rgba(0,9,14,0.4)]">
      <img
        [ngSrc]="event().url_imagem"
        [alt]="getEventTitle()"
        fill
        sizes="(max-width: 640px) 100vw, (max-width: 1024px) 50vw, 33vw"
        class="object-cover"
        (error)="$event.target.style.display='none'"
      />
    </div>
  }
  <div class="border-b border-[var(--color-border-light)] p-3 sm:p-4">
    <div
      class="mb-2 flex min-h-[1.375rem] flex-wrap items-center justify-between gap-2"
    >
      <p
        class="truncate text-[0.65rem] font-bold uppercase tracking-wide text-[var(--muted-foreground)] sm:text-[0.7rem]"
      >
        {{ getEventDate() }}
        @if (getEventTime()) {
          <span> · {{ getEventTime() }}</span>
        }
      </p>

      <span
        class="shrink-0 rounded-full bg-[rgba(142,202,230,0.1)] px-2 py-0.5 text-[0.6rem] font-semibold uppercase tracking-wide text-[var(--brand-sky-200)] sm:text-[0.65rem]"
        [title]="event().site_coleta"
      >
        {{ event().site_coleta }}
      </span>
    </div>
    <h4
      class="m-0 line-clamp-2 min-h-[2.75rem] text-base font-semibold leading-snug sm:min-h-[3.125rem] sm:text-lg"
      [title]="getEventTitle()"
    >
      {{ getEventTitle() }}
    </h4>
  </div>

  <div
    class="flex flex-1 flex-col divide-y divide-[var(--color-border-light)] px-3 sm:px-4"
  >
    <div
      class="grid grid-cols-[auto_1fr] items-baseline gap-2 py-2.5 text-xs sm:gap-3 sm:text-sm"
    >
      <span class="whitespace-nowrap text-[var(--muted-foreground)]"
        >Local</span
      >
      <span
        class="min-w-0 overflow-hidden truncate text-right font-medium"
        [title]="getEventLocation()"
        >{{ getEventLocation() }}</span
      >
    </div>
    <div
      class="grid grid-cols-[auto_1fr] items-baseline gap-2 py-2.5 text-xs sm:gap-3 sm:text-sm"
    >
      <span class="whitespace-nowrap text-[var(--muted-foreground)]"
        >Organizador</span
      >
      <span
        class="min-w-0 overflow-hidden truncate text-right font-medium"
        [title]="getEventOrganizer()"
        >{{ getEventOrganizer() }}</span
      >
    </div>
    <div
      class="grid grid-cols-[auto_1fr] items-baseline gap-2 py-2.5 text-xs sm:gap-3 sm:text-sm"
    >
      <span class="whitespace-nowrap text-[var(--muted-foreground)]"
        >Distâncias</span
      >
      <span
        class="min-w-0 min-h-[2rem] overflow-hidden text-right font-semibold text-[var(--primary)] line-clamp-2 sm:min-h-[2.25rem]"
        [title]="getEventDistances()"
      >
        {{ getEventDistances() }}
      </span>
    </div>
  </div>

  <div class="card-footer grid grid-cols-2 gap-2 p-3 pt-2.5 sm:p-4 sm:pt-3">
    <button class="btn btn-sm btn-primary" (click)="editEvent()">Editar</button>
    <button class="btn btn-sm btn-danger" (click)="deleteEvent()">
      Deletar
    </button>
  </div>
</article>

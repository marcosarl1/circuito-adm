@if (result(); as res) {
  <div
    class="rounded-xl border border-teal-800/30 bg-teal-950/30 p-4"
    role="status"
    aria-live="polite"
  >
    <div class="flex items-center gap-3">
      <div
        class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-teal-500 text-white"
        aria-hidden="true"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <div>
        <p class="m-0 text-sm font-semibold text-teal-100">
          Importação concluída
        </p>
        <p class="m-0 text-xs text-teal-200/70">
          {{ res.total }} eventos no banco
        </p>
      </div>
    </div>
    <div class="mt-4 grid grid-cols-3 gap-2">
      <div class="rounded-lg bg-black/20 px-3 py-2.5 text-center">
        <div
          class="text-[10px] font-semibold uppercase tracking-[0.08em] text-teal-200/60"
        >
          Novos
        </div>
        <div
          class="mt-1 flex items-center justify-center text-lg font-semibold leading-none tabular-nums text-white"
        >
          {{ res.novos }}
        </div>
      </div>
      <div class="rounded-lg bg-black/20 px-3 py-2.5 text-center">
        <div
          class="text-[10px] font-semibold uppercase tracking-[0.08em] text-teal-200/60"
        >
          Atualizados
        </div>
        <div
          class="mt-1 flex items-center justify-center text-lg font-semibold leading-none tabular-nums text-white"
        >
          {{ res.atualizados }}
        </div>
      </div>
      <div class="rounded-lg bg-black/20 px-3 py-2.5 text-center">
        <div
          class="text-[10px] font-semibold uppercase tracking-[0.08em] text-teal-200/60"
        >
          Total
        </div>
        <div
          class="mt-1 flex items-center justify-center text-lg font-semibold leading-none tabular-nums text-white"
        >
          {{ res.total }}
        </div>
      </div>
    </div>
  </div>
} @else if (importing()) {
  <div
    class="rounded-xl border border-[rgba(142,202,230,0.14)] bg-[rgba(0,9,14,0.22)] p-4"
    role="status"
    aria-live="polite"
    aria-busy="true"
  >
    <div class="flex items-center gap-3">
      <span
        class="h-4 w-4 shrink-0 animate-spin rounded-full border-2 border-[rgba(142,202,230,0.18)] border-t-[var(--brand-teal-500)]"
        aria-hidden="true"
      ></span>
      <p class="m-0 text-sm font-medium text-[var(--foreground)]">
        Salvando eventos...
      </p>
      <span
        class="ml-auto text-xs tabular-nums text-[var(--color-text-secondary)]"
        >aguarde</span
      >
    </div>
    <div
      class="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-[rgba(142,202,230,0.14)]"
    >
      <div
        class="h-full w-2/3 animate-pulse rounded-full bg-[var(--brand-teal-500)]"
      ></div>
    </div>
    <div class="mt-3 grid gap-2">
      <div
        class="h-3 w-full animate-pulse rounded bg-[rgba(142,202,230,0.08)]"
      ></div>
      <div
        class="h-3 w-5/6 animate-pulse rounded bg-[rgba(142,202,230,0.08)]"
      ></div>
      <div
        class="h-3 w-4/6 animate-pulse rounded bg-[rgba(142,202,230,0.08)]"
      ></div>
    </div>
  </div>
}

@if (error(); as err) {
  <div
    class="rounded-lg border border-red-800/50 bg-red-950 px-3 py-3 text-sm leading-5 text-red-100"
  >
    {{ err }}
  </div>
}

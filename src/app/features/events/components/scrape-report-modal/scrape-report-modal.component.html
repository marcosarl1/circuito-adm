<div
  class="fixed inset-0 z-[200] grid place-items-center bg-[rgba(0,9,14,0.72)] p-4 backdrop-blur-[8px] max-md:p-0"
  (click)="close.emit()"
>
  <div
    class="card flex max-h-[min(90vh,920px)] w-full max-w-[1040px] flex-col overflow-hidden max-md:max-h-[100dvh] max-md:overflow-auto max-md:rounded-none"
    role="dialog"
    aria-modal="true"
    aria-labelledby="scrape-report-title"
    (click)="$event.stopPropagation()"
  >
    <!-- header -->
    <app-scrape-report-header [view]="headerView()" />

    <!-- body -->
    <div
      class="flex-1 overflow-auto bg-[var(--card)] max-md:flex-none max-md:overflow-visible"
    >
      <div class="grid gap-4 p-6 max-md:p-4">
        @if (!report()) {
          <div class="grid place-items-center gap-3 py-10">
            <div
              class="h-6 w-6 animate-spin rounded-full border-2 border-[rgba(142,202,230,0.18)] border-t-[var(--brand-sky-500)]"
            ></div>
            <p class="text-sm text-[var(--color-text-secondary)]">
              Carregando relatório...
            </p>
          </div>
        } @else {
          <app-scrape-sources
            [view]="sourcesView()"
            (queryChange)="scraperQuery.set($event)"
            (toggleExpanded)="toggleExpanded()"
            (toggleDetail)="toggleDetail($event)"
            (closeDetail)="selectedDetail.set(null)"
          />

          <app-scrape-timeline [view]="timelineView()" />

          <app-scrape-csv-validation
            [view]="csvView()"
            (toggleOnlyAlerts)="toggleOnlyAlerts()"
            (showAll)="onlyAlerts.set(false)"
            (queryChange)="csvQuery.set($event)"
            (sortChange)="setSort($event)"
          />
        }

        <app-scrape-import-status
          [result]="importResult()"
          [error]="error()"
        />
      </div>
    </div>

    <!-- footer -->
    <div
      class="flex shrink-0 flex-wrap items-center justify-between gap-3 border-t border-[rgba(142,202,230,0.18)] bg-[var(--card)] p-4 max-md:sticky max-md:bottom-0 max-md:z-10 max-md:flex-col-reverse"
    >
      <span
        class="text-xs text-[var(--color-text-secondary)] max-md:text-center"
      >
        @if (importResult(); as res) {
          {{ res.novos }} novos, {{ res.atualizados }} atualizados,
          {{ res.total }} no banco
        } @else if (hasCsvs()) {
          {{ totalEventsCount() }} eventos coletados
        } @else {
          Nenhum evento coletado
        }
      </span>
      <div
        class="flex items-center gap-3 max-md:w-full max-md:flex-col-reverse"
      >
        <button
          type="button"
          data-autofocus
          class="btn btn-secondary max-md:w-full min-h-[36px] md:min-h-[44px] inline-flex items-center justify-center gap-1.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-teal-500)]"
          (click)="close.emit()"
        >
          <app-icon
            name="heroXMark"
            size="16"
            klass="shrink-0 relative top-[3px]"
            aria-hidden="true"
          ></app-icon>
          Fechar
        </button>
      </div>
    </div>
  </div>
</div>

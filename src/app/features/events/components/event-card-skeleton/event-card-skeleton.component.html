<article
  class="card flex h-full flex-col overflow-hidden border-[var(--color-border-light)]"
>
  <div class="border-b border-[var(--color-border-light)] p-3 sm:p-4">
    <div class="mb-2 flex items-center justify-between">
      <div
        class="h-3 w-24 animate-pulse rounded bg-[rgba(255,255,255,0.08)]"
      ></div>

      <div
        class="h-5 w-16 animate-pulse rounded-full bg-[rgba(255,255,255,0.08)]"
      ></div>
    </div>

    <div
      class="mb-2 h-5 w-5/6 animate-pulse rounded bg-[rgba(255,255,255,0.08)]"
    ></div>

    <div
      class="h-5 w-2/3 animate-pulse rounded bg-[rgba(255,255,255,0.08)]"
    ></div>
  </div>

  <div
    class="flex flex-1 flex-col divide-y divide-[var(--color-border-light)] px-3 sm:px-4"
  >
    @for (item of [1, 2, 3]; track item) {
      <div class="grid grid-cols-[auto_1fr] items-center gap-3 py-2.5">
        <div
          class="h-3 w-16 animate-pulse rounded bg-[rgba(255,255,255,0.08)]"
        ></div>

        <div
          class="ml-auto h-3 w-24 animate-pulse rounded bg-[rgba(255,255,255,0.08)]"
        ></div>
      </div>
    }
  </div>

  <div class="card-footer grid grid-cols-2 gap-2 p-3 pt-2.5 sm:p-4 sm:pt-3">
    <div class="h-9 animate-pulse rounded-md bg-[rgba(255,255,255,0.08)]"></div>

    <div class="h-9 animate-pulse rounded-md bg-[rgba(255,255,255,0.08)]"></div>
  </div>
</article>

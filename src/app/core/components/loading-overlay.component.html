@if (loading()) {
  <div
    class="fixed inset-0 z-[9999] grid place-items-center bg-black/50 backdrop-blur-sm"
  >
    <div class="flex flex-col items-center gap-4">
      <div
        class="h-12 w-12 animate-spin rounded-full border-4 border-[var(--brand-sky-200)] border-t-[var(--brand-orange-500)]"
      ></div>

      <p class="text-sm font-medium text-white">Carregando...</p>
    </div>
  </div>
}
